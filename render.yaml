# Render Blueprint — Arena API (NestJS backend + duel websocket).
# In Render: New → Blueprint → connect this repo (branch below). Then fill the
# `sync: false` secrets in the dashboard. Postgres lives on Neon (free) — its
# connection parts go into the DB_* vars.
#
# Free web services sleep after ~15 min idle → first request cold-starts (~50s).
# Fine for a demo; upgrade the plan to keep it warm.
services:
  - type: web
    name: arena-api
    runtime: node
    plan: free
    region: frankfurt # closest Render region to Lagos
    branch: feat/mvp-speed-math-async-duels
    # --production=false forces devDependencies (nest CLI, typescript) to install
    # even though NODE_ENV=production, so `nest build` can run. Runtime (node
    # dist/main) only needs the compiled output, so it stays lean regardless.
    buildCommand: yarn install --frozen-lockfile --production=false && yarn build
    startCommand: node dist/main
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      # Migrations run on boot (migrationsRun). See DEPLOY.md "Phase 0 cut-over"
      # before the first deploy of this config against the existing Neon DB.
      - key: DB_SSL
        value: "true" # Neon requires SSL
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: JWT_SECRET
        generateValue: true # Render generates a strong secret
      - key: SEED_TOKEN_SECRET
        generateValue: true # signs challenge seeds; rotating it voids in-flight sets
      - key: SENTRY_DSN
        sync: false # optional; error and payout alerts are off until set
      - key: PAYSTACK_SECRET_KEY
        sync: false # also verifies webhook signatures
      # --- set these in the dashboard (from your Neon connection string) ---
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      # = the deployed frontend origin (Step 3 in DEPLOY.md)
      - key: ALLOWED_ORIGINS
        sync: false
      # PORT is injected by Render automatically — the app reads process.env.PORT.
